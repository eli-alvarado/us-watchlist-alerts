# YAML form (requires PyYAML). Same schema as watchlist.json.
version: 1
settings:
  cooldown_minutes: 240
  sessions: [regular]
  extra_closures: []  # e.g. [YYYY-MM-DD] for an unscheduled NYSE closure
  stale_after_seconds: 900
tickers:
  - symbol: MSFT
    side: long
    thesis: Azure + Copilot monetization
    entry: 410
    targets: [450, 480]
    stop: 385
    tags: [megacap, ai]
    alerts:
      - {type: price_below, value: 395}
      - {type: pct_move, value: 3}
      - {type: earnings_within, value: 5}
  - symbol: TSLA
    side: short
    thesis: Example short position; review sizing and risk yourself
    entry: 400
    targets: [350]
    stop: 440
    tags: [example]
    alerts:
      - {type: price_above, value: 430}
