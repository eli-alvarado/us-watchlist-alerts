# Personal always-on alerts for a PRIVATE fork.
# Copy to .github/workflows/alerts.yml and set Actions secrets.
# Do not enable this on the public us-watchlist-alerts sample — live.yml is no-secrets.
#
#   python3 scripts/schedule.py   # prefer this if you have a machine that stays on
#
name: Personal alerts
on:
  schedule:
    # Every 5 minutes, weekdays, GitHub cron is UTC. alerts.py still gates on ET
    # (holidays / weekend / empty checks stay silent).
    - cron: "*/5 * * * 1-5"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run alerts with notify
        env:
          WATCHLIST_NOTIFY: ${{ secrets.WATCHLIST_NOTIFY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_URL: ${{ secrets.NTFY_URL }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          WATCHLIST_WEBHOOK_URL: ${{ secrets.WATCHLIST_WEBHOOK_URL }}
        run: python3 scripts/alerts.py --notify
